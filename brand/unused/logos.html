<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Jasco logo takes</title>
<link rel="icon" href="../../public/brand/icon.svg" type="image/svg+xml">
<style>
  body { margin: 0; padding: 32px 20px; background: #e9e4dd; color: #16120f; font: 16px/1.5 Archivo, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; display: grid; gap: 28px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); }
  h1 { max-width: 1000px; margin: 0 auto 24px; }
  figure { margin: 0; display: grid; gap: 10px; align-content: start; }
  .wall { background: #5a2a2c; padding: 40px; display: grid; place-items: center; min-height: 220px; }
  .wall img { width: 100%; max-width: 360px; }
  .row { display: flex; gap: 24px; align-items: center; }
  .row img:first-child { width: 128px; } .row img:nth-child(2) { width: 48px; } .row img:last-child { width: 16px; }
</style>
</head>
<body>
<h1>Logo takes</h1>
<main>
  <figure><div class="wall"><img src="../../public/brand/a-sign.svg" alt="Take A"></div><figcaption><strong>A. The sign.</strong> Closest to the existing branding. The site uses this one.</figcaption></figure>
  <figure><div class="wall"><img src="b-bottle.svg" alt="Take B"></div><figcaption><strong>B. The bottle.</strong> Same sign, with a bottle inside the A.</figcaption></figure>
  <figure><div class="wall"><img src="c-tag.svg" alt="Take C"></div><figcaption><strong>C. The tag.</strong> Shaped like a shelf price tag.</figcaption></figure>
  <figure><div class="wall"><div class="row"><img src="../../public/brand/icon.svg" alt=""><img src="../../public/brand/icon.svg" alt=""><img src="../../public/brand/icon.svg" alt=""></div></div><figcaption><strong>Icon.</strong> For the browser tab and profile pictures.</figcaption></figure>
</main>
</body>
</html>
